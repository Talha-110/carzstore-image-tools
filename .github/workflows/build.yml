name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name (registry needs lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/carzstore-image-tools:latest
            ghcr.io/${{ env.OWNER }}/carzstore-image-tools:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/carzstore-image-tools:run-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the new image
        run: |
          docker run -d --name it -p 8000:8000 -e WARMUP=0 ghcr.io/${{ env.OWNER }}/carzstore-image-tools:latest
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs it; exit 1
